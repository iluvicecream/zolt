name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Created if it does not exist."
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish zoltd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Downloaded directly instead of using mlugg/setup-zig: that action
      # requests Zig 0.16.0 under its old tarball naming scheme
      # (zig-linux-x86_64-...), which no longer exists. The official name
      # since 0.15 is zig-x86_64-linux-...
      - name: Install Zig 0.16.0
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/zig"
          curl -fsSL -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.local/zig" --strip-components=1
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"
          "$HOME/.local/zig/zig" version

      - name: Cross-compile release binaries
        run: |
          set -euo pipefail
          for target in x86_64-linux aarch64-linux x86_64-macos aarch64-macos; do
            zig build -Dtarget="$target" -Doptimize=ReleaseSafe --prefix "dist/$target"
          done

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for dir in dist/*/; do
            target=$(basename "$dir")
            mv "$dir/bin/zoltd" "release-assets/zoltd-$target"
          done
          (cd release-assets && sha256sum * > SHA256SUMS.txt)

      - name: Resolve release tag
        id: release
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${{ inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" release-assets/* --generate-notes
