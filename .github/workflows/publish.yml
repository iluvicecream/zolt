name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Created if it does not exist."
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish zoltd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      # Windows is intentionally not built: src/main.zig uses
      # std.process.argsAlloc(), which Zig 0.16 rejects on Windows.
      - name: Smoke test
        run: |
          set -euo pipefail
          zig build -Dtarget=x86_64-linux -Doptimize=ReleaseSafe --prefix dist/x86_64-linux
          mkdir -p /tmp/zolt-smoke
          printf 'return { host = "127.0.0.1:18081", isShowRuntimeError = true }\n' > /tmp/zolt-smoke/config.luau
          ./dist/x86_64-linux/bin/zoltd /tmp/zolt-smoke/config.luau > /tmp/zolt-smoke/server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18081/ -o /tmp/zolt-smoke/body -D /tmp/zolt-smoke/headers; then
              break
            fi
            sleep 1
          done
          grep -q '15' /tmp/zolt-smoke/body
          grep -qi 'server: zoltd' /tmp/zolt-smoke/headers

      - name: Cross-compile release binaries
        run: |
          set -euo pipefail
          for target in x86_64-linux aarch64-linux x86_64-macos aarch64-macos; do
            zig build -Dtarget="$target" -Doptimize=ReleaseSafe --prefix "dist/$target"
          done

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for dir in dist/*/; do
            target=$(basename "$dir")
            mv "$dir/bin/zoltd" "release-assets/zoltd-$target"
          done
          (cd release-assets && sha256sum * > SHA256SUMS.txt)

      - name: Resolve release tag
        id: release
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${{ inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" release-assets/* --generate-notes
